name: Check Adidas public catalog access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check normal public access without browser cookies or credentials
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://www.adidas.jp/メンズ-シューズ・靴-ランニング',{headers:{'user-agent':'ShoeZapCatalog/0.1 (+https://shoe-zap-27-prototype.ponpokoponnosuke.chatgpt.site)'},signal:AbortSignal.timeout(30000)});
          const html=await r.text();
          console.log(JSON.stringify({status:r.status,bytes:html.length,title:html.match(/<title>(.*?)<\/title>/)?.[1],scripts:[...html.matchAll(/<script\b([^>]*)>/g)].map(x=>x[1]).filter(x=>/id=|application\/json/.test(x)).slice(0,8)}));
          const m=html.match(/<script[^>]*id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);
          if(m){const j=JSON.parse(m[1]);console.log(JSON.stringify({root:Object.keys(j),props:Object.keys(j.props||{}),pageProps:Object.keys(j.props?.pageProps||{})}));const pp=j.props?.pageProps;console.log(JSON.stringify(pp).slice(0,6000));}
          if(!r.ok)process.exitCode=1;
          JS
