name: Update official shoe catalogs
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Only retry failed or unchecked Nike merchant articles
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nike-catalog-sync
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify collector behavior
        run: node --test server/nike-catalog.test.mjs
      - name: Collect fresh official listings and save catalog
        run: node scripts/nike-sync.mjs --upload
        env:
          NIKE_SYNC_URL: https://shoe-zap-27-prototype.ponpokoponnosuke.chatgpt.site/api/nike/sync
          NIKE_SYNC_KEY: ${{ secrets.NIKE_SYNC_KEY }}
  adidas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify Adidas official shop parser
        run: node --test server/adidas-catalog.test.mjs
      - name: Collect official Rakuten shop through the protected site bridge
        run: node scripts/adidas-sync.mjs
        env:
          CATALOG_SITE_ROOT: https://shoe-zap-27-prototype.ponpokoponnosuke.chatgpt.site
          NIKE_SYNC_KEY: ${{ secrets.NIKE_SYNC_KEY }}
  nike_market:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify exact-style matching and size uncertainty
        run: node --test server/nike-market.test.mjs
      - name: Match current Nike catalog against Rakuten shops and save results
        run: |
          if [ "$RETRY_FAILED" = "true" ]; then
            node scripts/nike-market-sync.mjs --failed-only
          else
            node scripts/nike-market-sync.mjs
          fi
        env:
          NIKE_SYNC_KEY: ${{ secrets.NIKE_SYNC_KEY }}
          RETRY_FAILED: ${{ inputs.retry_failed || 'false' }}
  brands_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Refresh additional official catalogs
        run: node scripts/brands-sync.mjs --catalog-only
        env:
          NIKE_SYNC_KEY: ${{ secrets.NIKE_SYNC_KEY }}
  brands_market:
    needs: brands_catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        brand: [brooks, saucony, salomon]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Match exact official color codes to Rakuten shops
        run: node scripts/brands-sync.mjs --market-only --brand=${{ matrix.brand }}
        env:
          NIKE_SYNC_KEY: ${{ secrets.NIKE_SYNC_KEY }}
